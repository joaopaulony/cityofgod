<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piloto Iso — Canvas 2D</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #eee; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #view { image-rendering: auto; cursor: none; }
  #hud { pointer-events: none; z-index: 2; }
  #view { z-index: 0; }
  #world3d { display: none; z-index: 1; pointer-events: none; }
  #chat, #keys { z-index: 4; }
  #mode-switch {
    position: fixed; z-index: 8; top: 14px; right: 15px;
    background: rgba(20,26,26,.88); border: 1px solid #b7a77e;
    color: #f5e8cd; padding: 11px 17px; border-radius: 9px;
    font: 700 13px system-ui, sans-serif; letter-spacing:.035em;
    box-shadow: 0 4px 18px rgba(0,0,0,.38); cursor:pointer;
  }
  #mode-switch:hover {background:rgba(57,68,63,.96);}
  #mode-switch:focus-visible{outline:2px solid #e7c877;outline-offset:2px}
  #mode-status {
    position:fixed;z-index:8;top:58px;right:16px;
    font:11px system-ui,sans-serif;color:#e0dbc9;
    text-shadow:0 1px 4px #000;pointer-events:none;text-align:right;
  }
  #chat {
    position: absolute; left: 12px; bottom: 12px; width: 270px;
    background: rgba(18,16,15,.82); border: 1px solid #000; border-radius: 6px;
    font-size: 12.5px; box-shadow: 0 2px 0 #000;
  }
  #chat .tabs { display: flex; border-bottom: 1px solid #2c2622; }
  #chat .tabs span { padding: 5px 12px; color: #8d857d; }
  #chat .tabs span.on { color: #fff; background: #2a2420; border-radius: 6px 6px 0 0; }
  #chat .log { height: 84px; overflow: hidden; padding: 6px 9px; line-height: 1.45; color: #ddd; }
  #chat .log b { color: #f2c46b; font-weight: 600; }
  #chat input {
    box-sizing: border-box; width: calc(100% - 12px); margin: 0 6px 6px; padding: 5px 8px;
    background: #0d0b0a; border: 1px solid #3a322c; border-radius: 4px; color: #eee; font: inherit; outline: none;
  }
  #keys {
    position: absolute; right: 12px; bottom: 12px; background: rgba(18,16,15,.82);
    border: 1px solid #000; border-radius: 6px; padding: 6px 4px; font-size: 12.5px;
  }
  #keys div { display: flex; justify-content: space-between; gap: 22px; padding: 3px 10px; }
  #keys kbd { color: #9a928a; font: inherit; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="world3d" aria-label="Visão tridimensional do City of God"></canvas>
<button id="mode-switch" type="button" aria-label="Alternar visualização 2D e 3D">VISÃO: 2D</button>
<div id="mode-status" role="status" aria-live="polite">2D clássico · tecla V alterna</div>
<canvas id="hud"></canvas>
<div id="chat">
  <div class="tabs"><span class="on">Geral</span><span>Local</span><span>Privado</span></div>
  <div class="log" id="log"></div>
  <input id="say" maxlength="60" placeholder="Enter para conversar…">
</div>
<div id="keys">
  <div>Andar <kbd>WASD</kbd></div>
  <div>Correr <kbd>Shift</kbd></div>
  <div>Atirar <kbd>Clique</kbd></div>
  <div>Mirar <kbd>Botão dir.</kbd></div>
  <div>Recarregar <kbd>R</kbd></div>
  <div>Girar câmera <kbd>Q / E</kbd></div>
  <div>Zoom <kbd>Roda</kbd></div>
  <div>Interagir / portas / escadas <kbd>F</kbd></div>
  <div>Dia / noite <kbd>N</kbd></div>
  <div>Novo mapa <kbd>G</kbd></div>
  <div>Modo 2D / 3D <kbd>V</kbd></div>
</div>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/archi.js"></script>
<script src="js/terrain.js"></script>
<script src="js/houses.js"></script>
<script src="js/roofs.js"></script>
<script src="js/multistorey.js"></script>
<script src="js/farmhouses.js"></script>
<script src="js/vision-light.js"></script>
<script src="js/urban-life.js"></script>
<script src="js/interiors.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/character.js"></script>
<script src="js/hud.js"></script>
<script src="js/ecosystem.js"></script>
<script src="js/view3d.js"></script>
<script src="js/game.js"></script>
<script>if (location.search.includes('scene=')) document.write('<script src="js/debug.js"><\/script>');</script>
</body>
</html>
