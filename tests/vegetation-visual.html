<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>City of God · Teste visual de vegetação</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141a14;color:#e9ebdf;font:14px/1.5 system-ui,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:#bfc9b4}
#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;max-width:1220px}
article{border:1px solid #46583b;border-radius:12px;overflow:hidden;background:#293c2b}
canvas{display:block;width:100%;height:auto;background:linear-gradient(#475c40 0 75%,#4d612d 75% 100%)}
article h2{margin:12px 12px 3px;font-size:16px}article p{margin:0 12px 14px;font-size:12px}
.good{color:#a9e38b}.bad{color:#ffa39a}#state{font-weight:600}
</style></head><body>
<h1>City of God — inspeção do Canvas da vegetação</h1>
<p>Teste dos <strong>pixels realmente preenchidos</strong> pelas copas. Os troncos não contam para a cobertura da copa. <a href="../index.html" style="color:#bde99b">Voltar ao jogo</a></p>
<p id="state">Gerando sprites procedurais…</p><div id="items"></div>
<script>
// Somente as primitivas que world.js utiliza ao pré-renderizar sprites.
// Sem dependência de GPU, bibliotecas, imagens externas ou motor do jogo.
'use strict';
const TAU=Math.PI*2,INK='#1b1310',SUN=[-.6,-.6,.8];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t),lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
let t=Math.imul(seed^seed>>>15,1|seed);t=(t+Math.imul(t^t>>>7,61|t))^t;return ((t^t>>>14)>>>0)/4294967296;};}
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function poly(g,pts,fill,ink=null,lw=1){g.beginPath();
g.moveTo(pts[0].x??pts[0][0],pts[0].y??pts[0][1]);
for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x??pts[i][0],pts[i].y??pts[i][1]);g.closePath();
if(fill){g.fillStyle=fill;g.fill();}if(ink){g.strokeStyle=ink;g.lineWidth=lw;g.stroke();}}
</script>
<script src="../js/visual-palette.js"></script>
<script src="../js/world.js"></script>
<script>
const kinds=[
  {kind:'oak',variant:'common'}, {kind:'oak',variant:'flowering'},
  {kind:'yard',variant:'fruiting'}, {kind:'street',variant:'mixed'},
  {kind:'pine',variant:null}, {kind:'pine',variant:null},
  {kind:'bush',variant:'amostra 1'}, {kind:'bush',variant:'amostra 2'},
  {kind:'bush',variant:'amostra 3'}
];
const host=document.getElementById('items'),state=document.getElementById('state');
let okCount=0;
async function run(){
  for(let i=0;i<kinds.length;i++){
    await new Promise(requestAnimationFrame);
    const {kind,variant}=kinds[i],isBush=kind==='bush',
      sp=isBush?makeBush():makeTree(kind,variant),
      canopy=isBush?sp.img:sp.crown,
      cg=canopy.getContext('2d',{willReadFrequently:true});
    const data=cg.getImageData(0,0,canopy.width,canopy.height).data;
    let visible=0,opaque=0,cyan=0;
    for(let j=3;j<data.length;j+=4){
      if(data[j]>24)visible++;
      if(data[j]>200)opaque++;
      if(data[j]>90 && data[j-1]>data[j-2]*.87 && data[j-1]>data[j-3]*1.08)cyan++;
    }
    const total=canopy.width*canopy.height,
      fraction=visible/total,
      opaqueFraction=opaque/total,
      minimum=kind==='pine'?.17:isBush?.12:.125,
      cyanFraction=cyan/Math.max(1,visible);
    // O arbusto precisa ter massa opaca, nao somente hastes e folhas invisiveis.
    const good=fraction>minimum && (!isBush || opaqueFraction>.09) &&
      (kind!=='pine' || cyanFraction<.04);
    if(good)okCount++;
    const el=document.createElement('article'),preview=makeCanvas(300,315);
    const g=preview.getContext('2d'),ground=295,x=150,sc=.92;
    g.save();g.translate(x,ground);g.scale(sc,sc);
    if(isBush)g.drawImage(sp.img,-sp.ax,-sp.ay);
    else {
      g.drawImage(sp.trunk,-sp.tax,-sp.tay);
      g.drawImage(sp.crown,-sp.cax,-sp.cay-sp.trunkH*40*.86);
    }
    g.restore();
    const details=isBush?
      'Ramos folhosos: '+sp.foliageClusters:
      'Galhos: '+sp.branchCount+' · raminhos: '+sp.twigCount+
      ' · flores: '+sp.flowers+' · frutos: '+sp.fruits;
    el.innerHTML='<h2>'+kind+' · '+(variant||'normal')+' · '+(sp.leafCount||sp.needleCount).toLocaleString('pt-BR')+' folhas/agulhas</h2>'+
      '<p>'+details+'</p>'+
      '<p class="'+(good?'good':'bad')+'">'+(good?'✓ Folhagem renderizada':'✗ Folhagem pouco visível')+
      ' · pixels: '+(fraction*100).toFixed(1)+'% · sólidos: '+(opaqueFraction*100).toFixed(1)+
      '% · ciano: '+(cyanFraction*100).toFixed(1)+'%</p>';
    preview.setAttribute('aria-label','Vegetação '+kind);el.prepend(preview);host.append(el);
    state.textContent=(i+1)+'/'+kinds.length+' variantes verificadas…';
  }
  state.textContent='Resultado: '+okCount+'/'+kinds.length+' copas com pixels visíveis';
  state.className=okCount===kinds.length?'good':'bad';
}
run().catch(e=>{state.className='bad';state.textContent='Falha no teste: '+e.message;console.error(e);});
</script>
</body></html>
