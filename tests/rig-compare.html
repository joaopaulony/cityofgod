<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rig comparação QA</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>body{margin:0;background:#5a5d63;color:#fff;font:12px system-ui;overflow:hidden}#hud{position:fixed;left:8px;top:4px;font-size:13px}.lbl{position:fixed;font-weight:600;opacity:.9}</style>
</head><body><div id="hud"></div>
<script type="module">
// Comparação do rig (mesma câmera em todas as colunas; linha de cima de frente, de baixo de perfil):
// malha original sem esqueleto | repouso (bind, sem animação) | parado em 3 instantes | poses de teste.
// ?id=<personagem>&base=/ (pasta com assets/) &cols=orig,bones,diff,rest,idle0,idle50,walk25,crouch30,rifle_aim30,arms,neck,elbows,legs,fist (clipe+% do tempo) &zoom=torso|hips|face|hand|rhand
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {loadRoster} from '../js/npc-roster.mjs';
import {TEST_POSES,applyTestPose} from '../js/rig-test-poses.mjs';
const q=new URLSearchParams(location.search),id=q.get('id')||'character-principal-base',base=q.get('base')||'/',zoom=q.get('zoom');
const POSES=TEST_POSES;
const cols=(q.get('cols')||'orig,rest,idle0,idle50,arms,neck,elbows,legs').split(',');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setScissorTest(true);document.body.appendChild(renderer.domElement);
const roster=await loadRoster(new GLTFLoader(),{base,style:q.get('style')!=='0'}),meta=roster.characters.get(id);   // &style=0: sem o estilo por sexo
const views=[];let frame=null;
for(const col of cols){
 const {gltf}=await roster.load(id);   // cache: cada coluna usa um clone independente
 const {clone}=await import('three/addons/utils/SkeletonUtils.js');
 const root=clone(gltf.scene),scene=new THREE.Scene();scene.background=new THREE.Color(0x5a5d63);
 scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2.2));const d=new THREE.DirectionalLight(0xffffff,1.6);d.position.set(1,3,2);scene.add(d);
 let label=col;
 if(col==='orig'){   // geometria original, sem esqueleto: malha comum com os mesmos vértices
  let sk;root.traverse(o=>{if(o.isSkinnedMesh)sk=o;});const g=sk.geometry.clone();g.deleteAttribute('skinIndex');g.deleteAttribute('skinWeight');
  scene.add(new THREE.Mesh(g,sk.material));label='original (sem esqueleto)';
 }else{
  scene.add(root);
  if(col==='rest')label='repouso (bind)';
  else if(col==='bones'){   // esqueleto aplicado, animações desligadas, ossos desenhados por cima
   const h=new THREE.SkeletonHelper(root);h.material.depthTest=false;h.material.transparent=true;scene.add(h);label='esqueleto aplicado, sem animação';
  }
  else if(col==='diff'){    // desvio por vértice da malha skinada no repouso × geometria original (mesma conta da GPU)
   let sk;root.traverse(o=>{if(o.isSkinnedMesh)sk=o;});root.updateMatrixWorld(true);sk.skeleton.update();
   const pos=sk.geometry.attributes.position,n=pos.count,col3=new Float32Array(n*3),v=new THREE.Vector3(),o=new THREE.Vector3();let max=0,sum=0,over=0;
   for(let i=0;i<n;i++){sk.getVertexPosition(i,v);o.fromBufferAttribute(pos,i);const d=v.distanceTo(o)*1000;max=Math.max(max,d);sum+=d;if(d>1)over++;const t=Math.min(1,d/1);col3.set([t,1-t*0.8,0.25*(1-t)],i*3);}
   const g=sk.geometry.clone();g.setAttribute('color',new THREE.BufferAttribute(col3,3));
   root.remove(sk);sk.parent?.remove(sk);scene.add(new THREE.SkinnedMesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
   scene.children.at(-1).bind(sk.skeleton,sk.bindMatrix);
   window.restDeviation={id,maxMm:+max.toFixed(4),meanMm:+(sum/n).toFixed(5),over1mm:over,vertices:n};
   label=`desvio: máx ${max.toFixed(3)} mm · >1 mm: ${over} de ${n}`;
  }
  else if(/^[a-z_]+\d+$/.test(col)&&!POSES[col]){const [,name,pct]=col.match(/^([a-z_]+?)(\d+)$/),c=gltf.animations.find(a=>a.name===name),t=+pct/100;const m=new THREE.AnimationMixer(root);m.clipAction(c).play();m.setTime(t*c.duration);label=(name==='idle'?'parado':name)+' @'+t;}
  else if(POSES[col]){applyTestPose(root,POSES[col]);label=POSES[col].label;}
 }
 if(q.get('bones')==='1'&&col!=='orig'&&col!=='bones'){const h=new THREE.SkeletonHelper(root);h.material.depthTest=false;scene.add(h);}   // &bones=1: esqueleto por cima em todas as colunas
 scene.updateMatrixWorld(true);
 if(!frame){const box=new THREE.Box3().setFromObject(scene);frame={c:box.getCenter(new THREE.Vector3()),h:box.max.y-box.min.y};}
 for(const side of [0,1]){const cam=new THREE.PerspectiveCamera(20,1,0.05,50),c=frame.c.clone();let dist=frame.h*3.3;
  if(zoom==='torso'){c.y=frame.h*0.74;dist=frame.h*1.25;}
  if(zoom==='face'){root.updateMatrixWorld(true);root.getObjectByName('mixamorigHead').getWorldPosition(c);c.y+=frame.h*0.01;dist=frame.h*0.75;}
  if(zoom==='hips'){c.y=frame.h*0.45;dist=frame.h*1.6;}
  if(zoom==='hand'||zoom==='rhand'){const h=root.getObjectByName(zoom==='rhand'?'mixamorigRightHandMiddle1':'mixamorigLeftHandMiddle1');root.updateMatrixWorld(true);h.getWorldPosition(c);dist=frame.h*0.22;cam.position.set(c.x,c.y+(side?0:dist),c.z+(side?dist:0.001));cam.lookAt(c);views.push({scene,cam,label:(side?'frente · ':'de cima · ')+label,col:cols.indexOf(col),row:side});continue;}
  cam.position.set(c.x+(side?dist:0),c.y,c.z+(side?0:dist));cam.lookAt(c);views.push({scene,cam,label:(side?'perfil · ':'frente · ')+label,col:cols.indexOf(col),row:side});}
}
for(const v of views){const el=document.createElement('div');el.className='lbl';el.textContent=v.label;document.body.appendChild(el);v.el=el;}
// desenha uma vez (e de novo se a janela mudar de tamanho): 16 vistas por quadro travariam a captura de tela
function draw(){
 renderer.setSize(innerWidth,innerHeight);const w=innerWidth/cols.length,h=innerHeight/2;
 for(const v of views){v.el.style.left=(v.col*w+6)+'px';v.el.style.top=(v.row*h+22)+'px';v.cam.aspect=w/h;v.cam.updateProjectionMatrix();const y=(1-v.row)*h;renderer.setViewport(v.col*w,y,w,h);renderer.setScissor(v.col*w,y,w,h);renderer.render(v.scene,v.cam);}
}
draw();addEventListener('resize',draw);
document.getElementById('hud').textContent=(meta?.name||id)+' — '+base;
window.__ready=true;
</script></body></html>
