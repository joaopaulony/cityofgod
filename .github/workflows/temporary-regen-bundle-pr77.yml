name: Temporary PR77 WebGL bundle regeneration
on:
  push:
    branches: [fix/presential-lots-preserve-visuals-nov13]
    paths: [.github/workflows/temporary-regen-bundle-pr77.yml]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated WebGL bundle on integration branch
        shell: bash
        run: |
          git diff --quiet -- js/vehicle-webgl.bundle.js && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vehicle-webgl.bundle.js
          git commit -m "Regenerate WebGL bundle for terrain and camera integration"
          git push origin HEAD:fix/presential-lots-preserve-visuals-nov13
