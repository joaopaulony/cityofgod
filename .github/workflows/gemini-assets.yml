name: Gemini Nano Banana - Generate game asset
on:
  pull_request:
    paths:
      - 'tools/gemini/**'
      - '.github/workflows/gemini-assets.yml'
      - 'assets/references/**'
  workflow_dispatch:
    inputs:
      asset_type:
        description: 'O que gerar'
        required: true
        type: choice
        options: [car, character, prop, building]
        default: car
      asset_name:
        description: 'Nome do asset, ex: superesportivo-roxo'
        required: true
        default: superesportivo-roxo
        type: string
      description:
        description: 'Detalhes e caracteristicas visuais desejadas'
        required: false
        type: string
      reference_path:
        description: 'Opcional: assets/references/nome.png (arquivo ja no repo)'
        required: false
        type: string
      direction:
        description: 'Direcao da camera'
        required: true
        type: choice
        options: [front-left, front-right, rear-left, rear-right, front, rear, left, right]
        default: front-left
      model:
        description: 'Modelo de imagem (consulte o preco no AI Studio)'
        type: choice
        options: [gemini-nano-banana-2.1, gemini-3.1-flash-image, gemini-3.1-flash-lite-image]
        default: gemini-nano-banana-2.1
      cutout:
        description: 'Tentar transformar fundo verde em transparencia (pode falhar)'
        required: true
        type: boolean
        default: false
      confirm_spend:
        description: 'Cobrar creditos? Desligado = teste GRATIS, sem chamada Gemini'
        required: true
        type: boolean
        default: false
      create_pr:
        description: 'Se gerar imagem, criar PR com PNG para aprovacao'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gemini-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Free tests - no Gemini charge
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image SDK and processing dependencies
        working-directory: tools/gemini
        run: npm install --no-audit --no-fund
      - name: Static syntax checks
        run: |
          node --check tools/gemini/generate-assets.mjs
          node --check tools/gemini/prompts.mjs
      - name: Free tests for prompts, validation and safety
        working-directory: tools/gemini
        run: npm test
      - name: Verify free dry run needs no API key
        working-directory: tools/gemini
        env:
          DRY_RUN: 'true'
          ASSET_TYPE: car
          ASSET_NAME: carro-roxo-teste
        run: npm run generate

  generate:
    name: Manual generation (one image maximum)
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image SDK and processing dependencies
        working-directory: tools/gemini
        run: npm install --no-audit --no-fund
      - name: Confirm key exists before paid generation
        if: inputs.confirm_spend
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY nao encontrado. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Create single image or free dry run
        id: gemini_generation
        working-directory: tools/gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASSET_TYPE: ${{ inputs.asset_type }}
          ASSET_NAME: ${{ inputs.asset_name }}
          ASSET_DETAILS: ${{ inputs.description }}
          REFERENCE_PATH: ${{ inputs.reference_path }}
          ASSET_DIRECTION: ${{ inputs.direction }}
          GEMINI_MODEL: ${{ inputs.model }}
          IMAGE_SIZE: 1K
          ASPECT_RATIO: '1:1'
          CUTOUT: ${{ inputs.cutout }}
          DRY_RUN: ${{ !inputs.confirm_spend }}
        run: npm run generate
      - name: Upload PNG and metadata for visual review
        uses: actions/upload-artifact@v4
        with:
          name: gemini-${{ github.run_id }}-review
          path: assets/generated/
          if-no-files-found: error
          retention-days: 14
      - name: Open optional review PR (never commit directly to main)
        id: optional_review_pr
        if: inputs.confirm_spend && inputs.create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: assets/generated/
          branch: assets/gemini-${{ github.run_id }}
          delete-branch: true
          commit-message: 'assets(gemini): generated ${{ inputs.asset_type }} for visual review'
          title: '[ASSET REVIEW] Gemini: ${{ inputs.asset_name }}'
          body: |
            Asset gerado por Gemini Nano Banana a pedido do mantenedor.
            Verifique o PNG, a referencia e o arquivo manifest.json.
            Nao foi integrado automaticamente ao renderer do jogo.
            Aprovacao visual humana obrigatoria antes de usar no Canvas 2D.
            Imagem produzida em uma chamada API com cobranca do projeto Google.

      - name: Where to download your generated PNG
        if: always() && steps.gemini_generation.outcome == 'success'
        shell: bash
        env:
          REVIEW_PR_OUTCOME: ${{ steps.optional_review_pr.outcome }}
          IS_PAID: ${{ inputs.confirm_spend }}
        run: |
          {
            echo "## Gemini - geracao concluida"
            if [ "$IS_PAID" = "true" ]; then
              echo "✅ Imagem criada. Baixe o arquivo **asset.png** no ZIP **gemini-${GITHUB_RUN_ID}-review** na secao **Artifacts** desta execucao."
            else
              echo "🧪 Dry-run gratuito: somente prompt.txt e manifest.json, sem PNG e sem custo de API."
            fi
            echo ""
            echo "➡️ **[Abra os artifacts desta execucao](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})**"
            if [ "$REVIEW_PR_OUTCOME" = "failure" ]; then
              echo ""
              echo "⚠️ **A imagem foi salva, mas o PR opcional foi bloqueado pela configuracao do GitHub Actions.** Isso NAO cancela nem apaga o PNG."
              echo "➡️ [Abra um PR manual a partir da branch gerada](https://github.com/${GITHUB_REPOSITORY}/pull/new/assets/gemini-${GITHUB_RUN_ID})"
              echo "Para corrigir em definitivo: Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests."
            fi
            echo ""
            echo "O jogo nao e alterado ate voce revisar/aprovar o asset."
          } >> "$GITHUB_STEP_SUMMARY"
