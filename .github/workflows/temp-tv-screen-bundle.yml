name: Temporary TV projection WebGL bundle sync
on:
  push:
    branches: [fix/3d-tv-projection-retro-left-radio]
    paths: [.github/workflows/temp-tv-screen-bundle.yml]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit updated scene bundle to feature branch
        run: |
          if git diff --quiet -- js/vehicle-webgl.bundle.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vehicle-webgl.bundle.js
          git commit -m "Regenerate WebGL bundle with exact TV face projection"
          git push origin HEAD:fix/3d-tv-projection-retro-left-radio
