name: Rebuild bundled 3D runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/rebuild-runtime.trigger'
permissions:
  contents: write
concurrency:
  group: city-of-god-runtime-rebuild
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate browser bundle
        run: npm run build
      - name: Publish the reproducible bundle when changed
        shell: bash
        run: |
          if git diff --quiet -- js/vehicle-webgl.bundle.js; then
            echo "Bundle already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vehicle-webgl.bundle.js
          git commit -m "Build: synchronize compiled 3D runtime"
          git push origin HEAD:main
