name: Install provided Comrade1280 2K WebP civil fleet
on:
  push:
    branches: [main]
    paths:
      - assets/vehicles/incoming/civil-fleet-2k-webp.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cityofgod-civil-import
  cancel-in-progress: false

jobs:
  install-civil-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check uploaded source and digest
        id: pack
        run: |
          set -euo pipefail
          source='assets/vehicles/incoming/civil-fleet-2k-webp.zip'
          if [ ! -f "$source" ]; then
            echo 'No pending civil pack. Nothing to install.'
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          echo '244df2166618311b3d2a3afcf8ada7f9fb34aa9e1b30f7c6f43a837e8df5ebb2  assets/vehicles/incoming/civil-fleet-2k-webp.zip' | sha256sum --check --status
          python3 - <<'PY'
          from zipfile import ZipFile
          source='assets/vehicles/incoming/civil-fleet-2k-webp.zip'
          ids=['ambulance','city-bus','fire-truck','garbage-truck','police-sedan','postal-van','school-bus','service-truck','taxi','tow-truck']
          expected={f'assets/vehicles/live/civil-{v}.glb' for v in ids}
          expected|={'assets/vehicles/live/COMRADE1280-CIVIL-ATTRIBUTION.txt','manifest.json'}
          with ZipFile(source) as z:
              assert set(z.namelist())==expected,'Unexpected ZIP members'
              for info in z.infolist():
                  assert not info.is_dir() and info.file_size<50000000,info.filename
                  assert not info.filename.startswith('/') and '..' not in info.filename.split('/'),info.filename
          print('Exactly ten individually supplied CC BY GLBs, metadata and attribution verified.')
          PY
      - name: Unpack and activate ten validated vehicles
        if: steps.pack.outputs.exists == 'true'
        run: |
          set -euo pipefail
          mkdir -p .civil-import
          unzip -q assets/vehicles/incoming/civil-fleet-2k-webp.zip -d .civil-import
          npm run import:civil -- .civil-import/assets/vehicles/live
          rm -rf .civil-import
      - name: Run regressions, inspect geometry and build deployment
        if: steps.pack.outputs.exists == 'true'
        run: |
          npm ci
          node --test tests/*.test.*
          npm run audit:vehicles
          npm run build:site
      - name: Publish real GLBs and updated catalog to main
        if: steps.pack.outputs.exists == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/vehicle-catalog.mjs assets/vehicles/live assets/vehicles/civil-import-manifest.json
          git rm assets/vehicles/incoming/civil-fleet-2k-webp.zip
          git diff --cached --check
          git commit -m "assets: integrate ten verified Comrade1280 2K WebP civil-service GLBs"
          git push origin HEAD:main
