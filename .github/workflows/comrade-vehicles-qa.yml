name: All Comrade GLB cars wheel-rig and camera QA
on:
  pull_request:
    paths:
      - js/vehicle-*
      - assets/vehicles/live/**
      - tests/comrade-*
      - .github/workflows/comrade-vehicles-qa.yml
permissions:
  contents: read
jobs:
  test-every-model:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate wheel physics, original GLB metadata, licensing
        run: node --test tests/live-vehicle.test.mjs tests/comrade-vehicle.test.mjs
      - name: Install browser driver
        run: npm install --no-fund --no-audit --no-save playwright@1.56.1
      - name: Load all models individually in real Chrome WebGL
        run: |
          npm run build
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/comrade-http.log 2>&1 &
          sleep 2
          node tests/comrade-vehicle-browser.cjs
      - name: Upload per-car screenshots and independent test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cityofgod-11-glb-wheel-tests
          path: artifacts/vehicles/
          if-no-files-found: ignore
