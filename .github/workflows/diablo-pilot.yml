name: Diablo pilot - ONE-TIME paid eight view asset generation
on:
  push:
    branches:
      - feat/diablo-pilot-isometric-sprites
    paths:
      - tools/gemini/trigger-diablo-once.txt
permissions:
  contents: write
concurrency:
  group: diablo-pilot-one-time
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diablo-pilot-isometric-sprites
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate payment authorization and source image
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing GEMINI_API_KEY"; exit 1; }
          test "$(cat tools/gemini/trigger-diablo-once.txt)" = "diablo-pilot-7-calls-approved" || exit 1
          test -s assets/generated/car/superesportivo-roxo-39819274197/asset.png || exit 1
          test ! -f assets/vehicles/diablo/manifest.json || { echo "::error::Manifest already present: paid run blocked"; exit 1; }
      - name: Install controlled SDK version
        working-directory: tools/gemini
        run: npm install --no-audit --no-fund
      - name: Paid image generation - seven directions maximum, no retries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIRM_PAID_DiABLO: diablo-pilot-7-calls-approved
        run: node tools/gemini/diablo-pilot.mjs
      - name: Save complete sprites in branch - not main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vehicles/diablo/
          git diff --cached --quiet && { echo "::error::No new image assets"; exit 1; }
          git commit -m "assets(diablo): seven AI-generated views plus cleaned master art"
          git push origin HEAD:feat/diablo-pilot-isometric-sprites
      - name: Upload image gallery sources for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diablo-pilot-eight-views
          path: assets/vehicles/diablo/
          if-no-files-found: ignore
          retention-days: 21
