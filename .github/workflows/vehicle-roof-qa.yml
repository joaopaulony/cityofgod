name: Verify all GLB roofs in Chrome
on:
  pull_request:
    paths:
      - js/vehicle-roof-visibility.mjs
      - js/vehicle-webgl*
      - js/houses.js
      - js/game.js
      - tests/vehicle-roof-browser.cjs
      - .github/workflows/vehicle-roof-qa.yml
permissions:
  contents: read
jobs:
  camera-roof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check world projection and house ordering tests
        run: node --test tests/vehicle-roof-order.test.mjs
      - name: Install Playwright
        run: npm install --no-audit --no-fund --no-save playwright@1.56.1
      - name: Verify roof fade in Chrome with 11 GLBs and 4 directions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/city-roof-http.log 2>&1 &
          sleep 2
          node tests/vehicle-roof-browser.cjs
      - name: Save actual vehicle roof before/after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-roof-regression
          path: artifacts/vehicle-roof/
          if-no-files-found: ignore
