name: CAS Reborn Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'js/cas-*.mjs'
      - 'js/character-webgl.mjs'
      - 'css/cas-creator.css'
      - 'tests/cas-browser-smoke.*'
      - 'tests/cas-reborn-browser.mjs'
      - 'assets/characters/reborn/**'
      - 'js/npc-population.js'
      - 'js/cas-npc-visual.mjs'
      - 'tests/npc-population-browser.*'
      - '.github/workflows/cas-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build and static tests
        run: npm run build:site
      - name: Launch local site and verify creation
        run: |
          PORT=4322 node tools/serve.mjs >/tmp/cas-reborn-http.log 2>&1 &
          for n in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4322/tests/cas-browser-smoke.html >/dev/null && break
            sleep 1
          done
          node tests/cas-browser-smoke.mjs
          node tests/cas-reborn-browser.mjs
          node tests/npc-population-browser.mjs
      - name: Attach screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cas-reborn-browser-screenshots
          path: |
            artifacts/cas-qa/*.png
            /tmp/cas-reborn-http.log
          if-no-files-found: ignore
          retention-days: 7
