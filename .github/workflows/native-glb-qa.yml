name: Native 3D vehicle game integration

on:
  pull_request:
    paths:
      - js/vehicle-glb-*
      - js/vehicle-model-catalog.mjs
      - assets/vehicles/native-glb/**
      - tests/native-glb-*
      - index.html
      - .github/workflows/native-glb-qa.yml

permissions:
  contents: read

jobs:
  chrome-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check models and module contracts
        run: node tests/native-glb-catalog.test.cjs
      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify native GLB textures and sprites in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vehicle-http.log 2>&1 &
          sleep 2
          node tests/native-glb-browser.cjs
      - name: Upload native vehicle previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-glb-car-previews
          path: artifacts/native-glb-*.png
          if-no-files-found: ignore
