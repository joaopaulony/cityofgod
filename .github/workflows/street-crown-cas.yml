name: City of God — Street Crown 24-to-76 Rig QA
on:
  push:
    branches: [feat/street-crown-cas-retarget-20261028, fix/cas-street-crown-visible-default-20261029]
    paths:
      - 'js/character-webgl.mjs'
      - 'js/cas-creator.mjs'
      - 'css/cas-creator.css'
      - 'tests/street-crown-world-browser.mjs'
      - 'js/street-crown-adapter.mjs'
      - 'tests/street-crown-adapter.test.mjs'
      - 'tests/cas-street-crown-browser.mjs'
      - 'tests/street-crown-world-browser.mjs'
      - 'tests/cas-street-crown-smoke.html'
      - 'assets/street-crown/**'
      - 'tools/extract-street-crown.py'
      - 'package.json'
      - '.github/workflows/street-crown-cas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests, backward compatibility and site build
        run: |
          npm run test:cas
          npm run test:rig-archive
          npm run build:site
      - name: Report asset import status — production remains gated
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets=Path('assets/street-crown')
          names=['hero','partner','ped_man','ped_woman','thug','boss']
          found=[p for p in names if (assets/(p+'.glb')).is_file()]
          print(f'STREET_CROWN_ASSETS_STAGED {len(found)}/6: {found}')
          if len(found) not in (0,6):
              raise SystemExit('Partial model import: do not release incomplete assets')
          if len(found)==0:
              print('BLOCKED_FOR_VISUAL_QA: six user-owned GLBs must be uploaded to the branch')
          PY
      - name: Real Chromium QA — run ONLY when six models are staged
        run: |
          if [ -f assets/street-crown/hero.glb ] && [ -f assets/street-crown/ped_woman.glb ]; then
            npm install --no-save playwright@1.56.1
            npx playwright install --with-deps chromium
            PORT=4322 node tools/serve.mjs > /tmp/street-crown-server.log 2>&1 &
            for i in $(seq 1 35); do
              curl -fsS http://127.0.0.1:4322/tests/cas-street-crown-smoke.html >/dev/null && break
              sleep 1
            done
            node tests/cas-street-crown-browser.mjs
            node tests/street-crown-world-browser.mjs
          else
            echo "BINARY_ASSETS_REQUIRED: no visual approval until the author's six GLBs are present"
          fi
      - name: Preserve real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-crown-76-bone-cas
          path: |
            artifacts/cas-qa/street-*.png
            /tmp/street-crown-server.log
          if-no-files-found: ignore
          retention-days: 7
