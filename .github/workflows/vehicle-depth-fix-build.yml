name: Build and validate GLB depth + collision fixes
on:
  push:
    branches: [fix/vehicle-depth-hitboxes-20261023]
    paths:
      - .github/workflows/vehicle-depth-fix-build.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Accurate GLB hitboxes, old gameplay and 11 cars regression
        run: |
          node --test tests/vehicle-depth-collision.test.mjs tests/comrade-vehicle.test.mjs tests/live-vehicle.test.mjs
          node --test tests/vegetation.test.js
      - name: Compile real-time WebGL without any screenshot baking
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save --no-package-lock three@0.180.0 esbuild@0.25.12
          ./node_modules/.bin/esbuild js/vehicle-webgl.mjs \
            --bundle --platform=browser --format=esm --target=es2020 \
            --minify --outfile=js/vehicle-webgl.bundle.js
          node --check js/vehicle-webgl.bundle.js
      - name: Commit locally bundled renderer to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/vehicle-webgl.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: WebGL car depth and collision module'
            git push origin HEAD:fix/vehicle-depth-hitboxes-20261023
          fi

# Retest accurate footprint and water probes after collision corrections.

# Final rebuild after porch fixture contact and per-scene depth coverage tests.
