name: Import licensed Benny and test dogs
on:
  push:
    branches: [city-sharpei-benny-replace-pets]
    paths:
      - '.github/workflows/import-real-dogs.yml'
permissions:
  contents: write
jobs:
  import-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download original licensed Benny FBX, verify integrity
        run: |
          mkdir -p assets/pets/thirdparty
          curl --fail --location --retry 4 --max-time 120 \
            'https://raw.githubusercontent.com/mengvf/Nintendoggos/master/Assets/Models/benny.fbx' \
            --output assets/pets/thirdparty/benny.fbx
          test "$(git hash-object assets/pets/thirdparty/benny.fbx)" = \
            '769a045bef1c8de49231389a4482fa36027093fc'
          test "$(wc -c <assets/pets/thirdparty/benny.fbx)" -gt 1000000
      - run: npm ci
      - name: Regression tests with both genuine dog assets present
        run: node --test tests/*.test.*
      - name: Build Vercel static output with 14 animal models
        run: npm run build:site
      - name: Persist the licensed and verified FBX in this review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pets/thirdparty/benny.fbx
          if ! git diff --cached --quiet; then
            git commit -m 'assets(pets): add licensed Benny Rottweiler FBX with preserved skeletal clips'
            git push origin HEAD:city-sharpei-benny-replace-pets
          fi
      - name: Install browser automation
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Render Shar Pei and Benny in real Chrome WebGL
        run: |
          npm start >/tmp/city-real-dogs.log 2>&1 &
          sleep 3
          node tools/capture-real-dogs.cjs
      - name: Upload real screenshots and browser verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-real-dogs-sharpei-benny
          path: artifacts/real-dogs/
          if-no-files-found: warn
