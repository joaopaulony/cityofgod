name: Canvas quality judge and regression tests
on:
  push:
    branches:
      - feat/organic-procedural-vegetation
    paths:
      - js/world.js
      - js/game.js
      - js/houses.js
      - js/roofs.js
      - js/archi.js
      - js/multistorey.js
      - js/farmhouses.js
      - js/vision-light.js
      - js/urban-life.js
      - js/vehicle-art.js
      - js/vehicle-sprites.js
      - assets/vehicles/**
      - tests/diablo-pilot.test.cjs
      - js/vehicle-drive.js
      - js/interiors.js
      - js/terrain.js
      - js/ecosystem.js
      - index.html
      - tests/vegetation*
      - tests/architecture.test.js
      - tests/visual-quality-judge.cjs
      - .github/workflows/vegetation.yml
  pull_request:
    paths:
      - js/world.js
      - js/game.js
      - js/houses.js
      - js/roofs.js
      - js/archi.js
      - js/multistorey.js
      - js/farmhouses.js
      - js/vision-light.js
      - js/urban-life.js
      - js/vehicle-art.js
      - js/vehicle-sprites.js
      - assets/vehicles/**
      - tests/diablo-pilot.test.cjs
      - js/vehicle-drive.js
      - js/interiors.js
      - js/terrain.js
      - js/ecosystem.js
      - index.html
      - tests/vegetation*
      - tests/architecture.test.js
      - tests/visual-quality-judge.cjs
      - .github/workflows/vegetation.yml
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check house geometry and stairs
        run: node tests/architecture.test.js
      - name: Check foliage generation
        run: node tests/vegetation.test.js
      - name: Check Diablo sprite integration and controls
        run: node tests/diablo-pilot.test.cjs
      - name: Validate generated Diablo angle silhouettes (free)
        working-directory: tools/gemini
        run: npm install --no-audit --no-fund
      - name: Fail on repeated Gemini direction silhouettes
        run: node tools/gemini/validate-diablo.mjs
      - name: Install headless browser driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Run browser pixel coverage test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vegetation-server.log 2>&1 &
          sleep 2
          node tests/vegetation-browser.cjs
      - name: Upload screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-visual-quality-snapshots
          path: |
            artifacts/*.png
            artifacts/quality-judge.json
          if-no-files-found: ignore
