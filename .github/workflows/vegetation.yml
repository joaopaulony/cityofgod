name: Vegetation Canvas smoke tests
on:
  push:
    branches:
      - feat/organic-procedural-vegetation
    paths:
      - js/world.js
      - js/game.js
      - tests/vegetation*
      - .github/workflows/vegetation.yml
  pull_request:
    paths:
      - js/world.js
      - js/game.js
      - tests/vegetation*
      - .github/workflows/vegetation.yml
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check foliage generation
        run: node tests/vegetation.test.js
      - name: Install headless browser driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Run browser pixel coverage test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vegetation-server.log 2>&1 &
          sleep 2
          node tests/vegetation-browser.cjs
      - name: Upload screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegetation-visual-snapshot
          path: artifacts/*.png
          if-no-files-found: ignore
