name: Import CAS Reborn rigged assets
on:
  push:
    branches: [main]
    paths:
      - 'tools/cas-reborn-sources.json'
      - '.github/workflows/cas-reborn-import.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cas-reborn-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GLB optimizer
        run: npm install --no-save --no-audit --no-fund @gltf-transform/cli@4.5.1
      - name: Download and optimize licensed generated assets
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const src=JSON.parse(readFileSync('tools/cas-reborn-sources.json','utf8'));
          mkdirSync('assets/characters/reborn',{recursive:true});
          for(const [key,url] of Object.entries(src.files)){
            if(!/^(male|female|walk|run|jump)$/.test(key))throw Error('Unexpected asset name '+key);
            if(!/^https:\/\/d8j0ntlcm91z4\.cloudfront\.net\/user_[A-Za-z0-9_-]+\/hf_[A-Za-z0-9_-]+\.glb$/.test(url))throw Error('Unexpected source URL host');
            const res=await fetch(url);
            if(!res.ok)throw Error('Cannot download '+key+': '+res.status);
            const bytes=new Uint8Array(await res.arrayBuffer());
            if(bytes.length<1000||bytes.length>40000000)throw Error('Unexpected '+key+' size '+bytes.length);
            if(new DataView(bytes.buffer).getUint32(0,true)!==0x46546c67)throw Error(key+' is not GLB');
            writeFileSync('/tmp/reborn-'+key+'.glb',bytes);
          }
          NODE
          for id in male female walk run jump; do
            npx gltf-transform optimize "/tmp/reborn-$id.glb" "assets/characters/reborn/$id.glb" \
              --compress quantize --simplify-ratio 0.55 --simplify-error 0.03 --texture-size 1024 --texture-compress webp
          done
          node tools/validate-cas-reborn.mjs
      - name: Commit validated assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/reborn/*.glb
          if git diff --cached --quiet; then echo 'No asset changes'; exit 0; fi
          git commit -m "assets(cas): import optimized Meshy rigged bodies and native locomotion"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Could not fast-forward after three attempts' >&2
          exit 1
