name: CAS Finger Bones and Hand Animation QA
on:
  push:
    branches: [feat/cas-articulated-hands-20261028]
    paths:
      - 'js/cas-reborn-hands.mjs'
      - 'js/cas-reborn-upperbody.mjs'
      - 'js/cas-creator.mjs'
      - 'js/character-webgl.mjs'
      - 'tests/cas-reborn-hands.test.mjs'
      - 'tests/cas-reborn-upperbody.test.mjs'
      - 'tools/inspect-reborn-rig.mjs'
      - 'package.json'
      - '.github/workflows/cas-finger-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rig-and-motions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inspect original 24-bone wrist axes
        run: node tools/inspect-reborn-rig.mjs
      - name: Validate animated skeleton extensions
        run: |
          npm run test:cas
          npm run test:rig-archive
          npm run build:site
