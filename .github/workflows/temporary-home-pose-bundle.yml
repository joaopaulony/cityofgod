name: Temporary home pose WebGL bundle refresh
on:
  push:
    branches: [fix/home-seat-facing-bed-and-indoors-20261113]
    paths: [.github/workflows/temporary-home-pose-bundle.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit refreshed WebGL bundle
        run: |
          if git diff --quiet -- js/vehicle-webgl.bundle.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vehicle-webgl.bundle.js
          git commit -m "Regenerate WebGL animations bundle with restored home poses"
          git push origin HEAD:fix/home-seat-facing-bed-and-indoors-20261113
